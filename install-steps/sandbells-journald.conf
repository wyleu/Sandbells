# Sandbells: keep the journal across reboots (crash evidence), small for the SD card.
# Installed to: /etc/systemd/journald.conf.d/sandbells.conf
[Journal]
Storage=persistent
SystemMaxUse=50M
SystemMaxFileSize=10M
# Write to the card at most once a minute (default 5 min) so a hard hang
# loses at most the last minute; crit/alert/emerg are still synced at once.
SyncIntervalSec=60s
