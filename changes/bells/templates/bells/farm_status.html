{% load static events_live %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Farm · {{ inst.name }}</title>
  <link rel="stylesheet" href="{% static 'css/farm_status.css' %}?v={{ git_hash }}">
  {% include "events/menu_style.html" %}
</head>
<body{% if live_events %} class="with-live"{% endif %}>
  <header id="farm-header" class="topbar">
    {% top_menu current=index %}
    <span id="farm-ident">{{ inst.family }} · {{ inst.name }}</span>
    <span id="farm-level" class="level level-unknown">…</span>
    <span id="farm-summary"></span>
    <span class="right">{% include "events/mini_clock.html" %}</span>
  </header>

  <main id="farm-main">
    <p id="farm-wait">Loading {{ inst.name }}…</p>
  </main>
  {% if live_events %}{% live_panel %}{% endif %}

  <script src="{% static 'js/farm_status.js' %}?v={{ git_hash }}"></script>
  <script>
    FarmStatus.start({
      kind: "{{ inst.kind }}",
      family: "{{ inst.family }}",
      name: "{{ inst.name }}",
      id: "{{ inst.id }}",
      statusUrl: "{{ inst.status_url|default:'' }}",
      wsUrl: "{{ inst.ws_url|default:'' }}",
      wsUrls: {{ ws_urls_json }},
      interval: {{ inst.poll_hint_sec|default:15 }}000
    });
  </script>
</body>
</html>
