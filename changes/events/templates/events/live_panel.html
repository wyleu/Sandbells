<style>
  /* Live stroke list: the whole Strokes page (events/strokes.html), sized for
   * HDMI at a distance.  One band across the top -- the clock, the
   * concentrator link strip, this ring's counts -- and under it the list,
   * the full screen wide, so the beat column (lead left, lag right) is wide. */
  #live-events { min-height: 0; overflow: hidden; margin: 0.5rem 0.8rem 0.6rem;
                 border: 1px solid #333; border-radius: 8px; background: #181818;
                 padding: 0.5rem 0.8rem; display: grid; gap: 0.2rem 1.4rem;
                 grid-template-columns: auto minmax(min-content, 1fr) minmax(0, 20rem);
                 grid-template-rows: auto minmax(0, 1fr);
                 grid-template-areas: "top link head" "list list list"; }
  #live-events > .live-top { grid-area: top; }
  #live-events > #link-widget { grid-area: link; align-self: start; margin-top: 0; }
  #live-events > .live-head { grid-area: head; align-self: start; }
  #live-events > #live-table { grid-area: list; align-self: start; }
  .live-head { display: flex; flex-wrap: wrap; gap: 0.2rem 1.5rem; align-items: baseline; }
  .live-big { font-size: 2.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .live-big small { font-size: 1rem; font-weight: normal; opacity: 0.65; margin-left: 0.3rem; }
  #live-heads { font-size: 1.3rem; opacity: 0.85; flex-basis: 100%; }
  #live-idle { font-size: 1.4rem; color: #ec6; flex-basis: 100%; }
  #live-warn { font-size: 1.4rem; color: #f66; background: #511; border-radius: 6px;
               padding: 0.2rem 0.5rem; flex-basis: 100%; }
  #live-table { border-collapse: collapse; margin-top: 0.4rem; width: 100%;
                font-size: 1.7rem; font-variant-numeric: tabular-nums; }
  #live-table td { padding: 0.15rem 0.5rem 0.15rem 0; border-bottom: 1px solid #2a2a2a;
                   white-space: nowrap; }
  #live-table td.iv { text-align: right; font-weight: 600; }
  #live-table .ch { font-size: 1.1rem; opacity: 0.7; margin-left: 0.4rem; }
  #live-table .q { font-size: 0.9rem; color: #7d7; }
  #live-table .q.dim, #live-table td.dim { opacity: 0.45; color: #aaa; }
  /* Beat column: the middle of each stroke row, most of the screen wide.  A
   * gold mark sits at that stroke's place against the current beat (centre on
   * the beat, left early = leading, right late = lagging; the ends are half a
   * beat out or more), with a pale bar back to the centre line so the size of
   * the lead or lag reads at a distance and a rhythm reads as a vertical graph
   * down the list.  Faint ticks at a quarter of a beat each side. */
  #live-table td.beat { position: relative; width: 58%; padding: 0;
                        background-image:
                          linear-gradient(to right, transparent calc(25% - 1px), #2e2e2e calc(25% - 1px),
                                          #2e2e2e 25%, transparent 25%,
                                          transparent calc(75% - 1px), #2e2e2e calc(75% - 1px),
                                          #2e2e2e 75%, transparent 75%); }
  #live-table td.beat::before { content: ""; position: absolute; left: 50%; top: 10%;
                                bottom: 10%; border-left: 2px dashed #555; }
  #live-table .beat-bar { position: absolute; top: 34%; bottom: 34%;
                          background: rgba(255, 204, 51, 0.28); }
  #live-table .beat-mark { position: absolute; top: 8%; bottom: 8%; width: 6px;
                           margin-left: -3px; border-radius: 3px; background: #fc3; }
  #live-table thead th { font-size: 0.95rem; font-weight: normal; color: #998;
                         text-align: left; padding: 0 0.5rem 0.15rem 0;
                         border-bottom: 1px solid #333; white-space: nowrap; }
  #live-table thead th.iv { text-align: right; }
  #live-table thead th.beat-scale { position: relative; padding: 0; height: 1.3rem; }
  .beat-scale span { position: absolute; top: 0; transform: translateX(-50%); }
  .beat-scale span.lead { transform: none; color: #9bd; }
  .beat-scale span.lag { transform: translateX(-100%); color: #db9; }
  #live-table tr.new td { background-color: #223; }
  #live-table tr td { transition: background-color 1.5s; }
  /* Clock: top LEFT of the panel, right over the time column of the list so
   * one glance up and down compares them.  Its
   * colour is the link state: green connected, grey stale, red lost. */
  #live-events { --clk: #f33; --clk-bg: #2a0b0b; --clk-bg2: #4a0f0f;
                 --clk-line: #733; --clk-done: #622; --clk-next: #e88; }
  #live-events[data-link="ok"] { --clk: #5c5; --clk-bg: #0d200d; --clk-bg2: #143a14;
                 --clk-line: #363; --clk-done: #262; --clk-next: #8c8; }
  #live-events[data-link="stale"] { --clk: #aaa; --clk-bg: #222; --clk-bg2: #333;
                 --clk-line: #555; --clk-done: #444; --clk-next: #999; }
  .live-top { display: flex; align-items: flex-start; }
  /* Concentrator link strip: LED mimic + verdict, readable at a distance. */
  #link-widget { display: flex; flex-wrap: wrap; align-items: center; gap: 0.2rem 1rem;
                 border: 3px solid #333; border-radius: 8px; padding: 0.3rem 0.6rem;
                 margin: 0.2rem 0 0.4rem; }
  #link-widget.ok { border-color: #2a6; }
  #link-widget.stale { border-color: #777; background: #222; }
  #link-widget.lost { border-color: #f33; background: #2a0b0b; }
  .lw-leds { display: flex; gap: 0.35rem; }
  .lw-led { width: 1.4rem; height: 1.4rem; border-radius: 50%; background: #222;
            border: 1px solid #555; }
  .lw-led.edge { width: 1.8rem; height: 1.8rem; }
  .lw-cell { display: flex; flex-direction: column; align-items: center; min-width: 3.6rem; }
  .lw-kind { font-size: 0.95rem; opacity: 0.85; white-space: nowrap; }
  .lw-kind.bad, .lw-note.bad { color: #f66; font-weight: 700; }
  .lw-kind.trig, .lw-note.trig { color: #a8f; }
  #lw-chans { flex-basis: 100%; font-size: 1.1rem; }
  #live-table tr.info.fault td { color: #f88; }
  #lw-head { font-size: 1.9rem; font-weight: 700; }
  #link-widget.ok #lw-head { color: #6d6; }
  #link-widget.stale #lw-head { color: #aaa; }
  #link-widget.lost #lw-head { color: #f55; }
  #lw-why, #lw-leds { font-size: 1.1rem; opacity: 0.8; }
  .lw-lines { flex-basis: 100%; font-size: 1.05rem; opacity: 0.85; }
  .lw-time.ok { color: #7d7; } .lw-time.warn { color: #ec6; } .lw-time.bad { color: #f66; }
  #live-table tr.info td { font-size: 1.05rem; color: #9ab; }
  #live-clock { margin-left: calc(-0.5rem - 3px); text-align: left; color: var(--clk);
                padding: 0.1rem 0.5rem; border: 3px solid transparent; border-radius: 8px; }
  #live-clock.mark { border-color: var(--clk); background: var(--clk-bg); }
  #live-clock.minute { background: var(--clk-bg2); }
  #clock-hms { font-size: 5rem; font-weight: 700; line-height: 1;
               font-variant-numeric: tabular-nums; }
  #clock-zone { font-size: 1.1rem; opacity: 0.7; margin-left: 0.4rem; }
  .clock-q { display: flex; justify-content: flex-start; align-items: center; gap: 0.3rem;
             margin-top: 0.3rem; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  #clock-segs { display: flex; gap: 0.3rem; }
  .clock-seg { display: inline-block; width: 2.2rem; height: 0.7rem;
               border: 1px solid var(--clk-line); border-radius: 2px; }
  .clock-seg.done { background: var(--clk-done); }
  .clock-seg.now { background: var(--clk); }
  #clock-next { margin-left: 0.6rem; color: var(--clk-next); }
  #live-clock.soon #clock-next, #live-clock.mark #clock-next { color: var(--clk); font-weight: 700; }
  /* 800x480 and 1024x600: the same band, smaller, so the list keeps its rows */
  @media (max-height: 640px) {
    #live-events { padding: 0.35rem 0.6rem; margin: 0.3rem 0.4rem 0.4rem; gap: 0.1rem 0.8rem; }
    #clock-hms { font-size: 3rem; }
    .clock-q { font-size: 1.1rem; margin-top: 0.15rem; }
    .clock-seg { width: 1.4rem; height: 0.5rem; }
    .live-big { font-size: 1.6rem; }
    .live-big small { font-size: 0.85rem; }
    #live-heads { font-size: 0.95rem; }
    #link-widget { padding: 0.15rem 0.4rem; gap: 0.1rem 0.6rem; }
    .lw-led { width: 1rem; height: 1rem; } .lw-led.edge { width: 1.3rem; height: 1.3rem; }
    .lw-cell { min-width: 2.8rem; }
    .lw-kind { font-size: 0.75rem; }
    #lw-head { font-size: 1.3rem; }
    #lw-why, #lw-leds, .lw-lines, #lw-chans { font-size: 0.85rem; }
    #live-table { font-size: 1.3rem; margin-top: 0.2rem; }
    #live-table .ch { font-size: 0.85rem; }
    #live-table thead th { font-size: 0.8rem; }
  }
</style>
<aside id="live-events" data-link="stale"
       data-url="{{ since_url }}" data-type="{{ type }}" data-first="{{ first_load }}"
       data-batch="{{ batch }}" data-rows="{{ dom_rows }}" data-poll="{{ poll_ms }}"
       data-retry-max="{{ retry_max_ms }}" data-fails-warn="{{ fails_warn }}"
       data-idle="{{ idle_ms }}" data-ring-gap="{{ ring_gap_ms }}"
       data-timeout="{{ timeout_ms }}" data-tz="{{ tz }}">
  <div class="live-top">
    <div id="live-clock" data-tz="{{ tz }}">
      <div><span id="clock-hms">--:--:--</span><small id="clock-zone"></small></div>
      <div class="clock-q"><span id="clock-segs"></span><span id="clock-next"></span></div>
    </div>
  </div>
  <div id="link-widget" class="lw stale" data-url="{{ link_url }}"
       data-poll="{{ link_poll_ms }}" data-timeout="{{ timeout_ms }}">
    <div class="lw-leds" title="concentrator panel LEDs (last heartbeat)">
      <span class="lw-led edge"></span>
      <span class="lw-cell"><span class="lw-led"></span><small class="lw-kind"></small></span>
      <span class="lw-cell"><span class="lw-led"></span><small class="lw-kind"></small></span>
      <span class="lw-cell"><span class="lw-led"></span><small class="lw-kind"></small></span>
      <span class="lw-cell"><span class="lw-led"></span><small class="lw-kind"></small></span>
      <span class="lw-led edge"></span>
    </div>
    <span id="lw-head">…</span><span id="lw-why"></span><span id="lw-leds"></span>
    <div class="lw-lines"><span id="lw-detail"></span> <span id="lw-drop"></span></div>
    <div class="lw-lines"><span id="lw-time" class="lw-time"></span></div>
    <div id="lw-chans" title="survey: why a socket is a fault or a trigger"></div>
  </div>
  <div class="live-head">
    <div class="live-big"><span id="live-ring-count">—</span><small id="live-ring-label">strokes this ring</small></div>
    <div class="live-big"><span id="live-since">—</span><small>since last stroke</small></div>
    <div id="live-heads"></div>
    <div id="live-idle" hidden></div>
    <div id="live-warn" hidden></div>
  </div>
  <table id="live-table">
    <thead><tr><th>time</th><th>bell</th>
      <th class="beat-scale" title="this stroke's gap against the beat (median of the last gaps of the same stroke)"><span class="lead" style="left:0">&#9664; early · lead</span><span style="left:25%">&frac14;</span><span style="left:50%">on the beat</span><span style="left:75%">&frac14;</span><span class="lag" style="left:100%">late · lag &#9654;</span></th>
      <th class="iv">gap</th><th></th></tr></thead>
    <tbody id="live-rows"></tbody>
  </table>
</aside>
<script>
{% include "events/beat.js" %}
{% include "events/live_list.js" %}
{% include "events/clock.js" %}
{% include "events/link_widget.js" %}
</script>
