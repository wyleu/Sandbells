{% load events_live %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sandbells{% endblock %}</title>
  <style>
    /* Inline: no collectstatic needed, no JS libraries.  Kiosk-dark like farm status. */
    html, body { margin: 0; background: #111; color: #eee;
                 font-family: system-ui, sans-serif; font-size: 18px; }
    a { color: #8af; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { display: flex; gap: 0.4rem 0.6rem; align-items: center; flex-wrap: wrap;
             padding: 0.45rem 0.8rem; border-bottom: 1px solid #333; }
    header .right { margin-left: auto; display: flex; gap: 0.7rem; align-items: center;
                    white-space: nowrap; }
    header .host { opacity: 0.6; font-size: 0.85rem; }
    @media (max-width: 1100px) { header .host { display: none; } }   /* keep the clock on the top line */
    main { padding: 0.6rem 0.8rem 1.2rem; }
    h1 { font-size: 1.3rem; margin: 0.2rem 0 0.6rem; }
    table { border-collapse: collapse; }
    th, td { padding: 0.3rem 0.6rem; border-bottom: 1px solid #2a2a2a;
             text-align: left; vertical-align: top; }
    th { color: #aaa; font-weight: normal; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .muted { opacity: 0.6; }
    .warn { color: #fc6; }
    .heads { font-size: 0.85rem; opacity: 0.8; }
  </style>
  {% include "events/menu_style.html" %}
</head>
<body>
  <header class="topbar">
    {% top_menu current="days" %}
    {% block crumbs %}{% endblock %}
    <span class="right"><span class="host">{{ host }}</span>
    {% include "events/mini_clock.html" %}</span>
  </header>
  <main>{% block main %}{% endblock %}</main>
</body>
</html>
